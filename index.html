<script>
const KEY='netflow_reseller_billing_v14';
const SUPABASE_URL_KEY='netflow_supabase_url';
const SUPABASE_ANON_KEY='netflow_supabase_anon';
const DEFAULT_SUPABASE_URL='https://ejpvhkknjemmlpfdrinx.supabase.co';
const DEFAULT_SUPABASE_KEY='sb_publishable_GbqwdbcwzK3uD6QYbEifmQ_ZUa6TLIc';
let supabaseClient=null, cloudUser=null, cloudBusy=false, cloudReady=false, cloudChannel=null; let profile=null; let workspaceId=null; if(!getSupabase()) profile={role:'owner'};
function getSupabase(){
  const url=localStorage.getItem(SUPABASE_URL_KEY)||DEFAULT_SUPABASE_URL;
  const key=localStorage.getItem(SUPABASE_ANON_KEY)||DEFAULT_SUPABASE_KEY;
  if(!url||!key||!window.supabase) return null;
  try{
    return window.supabase.createClient(url,key,{
      auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
    });
  }catch(e){console.error('Supabase client creation failed',e);return null}
}
async function testCloudConnection(url,key){
  url=(url||'').trim().replace(/\/$/,''); key=(key||'').trim();
  if(!/^https:\/\/[^\s]+\.supabase\.co$/i.test(url)) throw new Error('Project URL looks invalid. Use https://YOUR_PROJECT.supabase.co');
  if(!key) throw new Error('Enter the Supabase publishable/anon public key.');
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const r=await fetch(url+'/auth/v1/settings',{method:'GET',headers:{apikey:key},signal:controller.signal,cache:'no-store'});
    const text=await r.text();
    if(!r.ok) throw new Error('Supabase responded HTTP '+r.status+(text?' — '+text.slice(0,180):''));
    return true;
  }catch(e){
    if(e?.name==='AbortError') throw new Error('Supabase connection timed out. Check the Project URL, internet/VPN, or an iPhone content blocker.');
    if(/Failed to fetch|Load failed|NetworkError/i.test(String(e?.message||e))) throw new Error('The browser cannot reach Supabase. Check the Project URL, internet/VPN, DNS, or Safari content blockers.');
    throw e;
  }finally{clearTimeout(timer)}
}
function configureCloud(url,key){url=(url||DEFAULT_SUPABASE_URL).trim().replace(/\/$/,''); key=(key||DEFAULT_SUPABASE_KEY).trim(); localStorage.setItem(SUPABASE_URL_KEY,url);localStorage.setItem(SUPABASE_ANON_KEY,key);supabaseClient=getSupabase();return supabaseClient;}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{companies:[],packages:[],customers:[],invoices:[],payments:[],expenses:[],staff:[],devices:[{id:'vsol-01',name:'VSOL OLT 01',model:'VSOL EPON OLT',ip:'38.68.84.52',port:'308',url:'https://38.68.84.52:308/action/login.html',location:'Main POP',notes:'Read-only monitoring; configure SNMP community to enable live telemetry.',adapterId:'vsol-01',adapterUrl:'/api/olts/vsol-01/live',lastTelemetry:null}]};
let view='dashboard'; let filter='all'; let selectedDeviceId=null; let deviceTab='overview';
function save(){localStorage.setItem(KEY,JSON.stringify(db));render(); if(cloudReady && cloudUser && workspaceId) syncCloud();}
function role(){const r=String(profile?.role||'').toLowerCase(); return PERMS[r]?r:'owner'}
const PERMS={
  owner:['dashboard','companies','customers','packages','billing','payments','expenses','staff','reports','import','devices','settings'],
  admin:['dashboard','companies','customers','packages','billing','payments','expenses','staff','reports','import','devices','settings'],
  manager:['dashboard','companies','customers','packages','billing','payments','expenses','reports','import','devices'],
  billing:['dashboard','customers','billing','payments','devices'],
  support:['dashboard','customers','devices'],
  unassigned:[]
};
function can(v){return (PERMS[role()]||[]).includes(v)}
function canSeeCosts(){return ['owner','admin','manager'].includes(role())}
function canManageStaff(){return ['owner','admin'].includes(role())}
function canEditData(){return ['owner','admin','manager','billing'].includes(role())}
async function getProfile(){if(!supabaseClient||!cloudUser)return null;const {data,error}=await supabaseClient.from('isp_profiles').select('*').eq('user_id',cloudUser.id).maybeSingle();if(error){console.error(error);return null}profile=data||null;workspaceId=profile?.workspace_id||null;return profile}
function emptyDb(){return {companies:[],packages:[],customers:[],invoices:[],payments:[],expenses:[],staff:[],devices:[]}}
function mergeCloudDb(localData,remoteData){
  const out=emptyDb();
  Object.keys(out).forEach(k=>{
    const local=Array.isArray(localData?.[k])?localData[k]:[];
    const remote=Array.isArray(remoteData?.[k])?remoteData[k]:[];
    const map=new Map();
    remote.forEach(x=>map.set(String(x.id),x));
    local.forEach(x=>{if(x?.id && !map.has(String(x.id)))map.set(String(x.id),x);});
    out[k]=Array.from(map.values());
  });
  return out;
}
async function syncCloud(){
  if(!supabaseClient||!cloudUser||!cloudReady||cloudBusy||!workspaceId)return;
  cloudBusy=true;
  try{
    const {error}=await supabaseClient.from('isp_workspaces').upsert(
      {user_id:workspaceId,data:db,updated_at:new Date().toISOString()},
      {onConflict:'user_id'}
    );
    if(error)throw error;
  }catch(e){console.error(e);toast('Cloud sync failed: '+(e.message||'Check Supabase/RLS'));}finally{cloudBusy=false;}
}
function subscribeCloud(){
  if(!supabaseClient||!workspaceId)return;
  if(cloudChannel){supabaseClient.removeChannel(cloudChannel);cloudChannel=null;}
  cloudChannel=supabaseClient.channel('netflow-workspace-'+workspaceId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'isp_workspaces',filter:'user_id=eq.'+workspaceId},payload=>{
      if(!payload?.new?.data)return;
      db=Object.assign(emptyDb(),payload.new.data);
      localStorage.setItem(KEY,JSON.stringify(db));
      render();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'isp_workspaces',filter:'user_id=eq.'+workspaceId},payload=>{
      if(!payload?.new?.data)return;
      db=Object.assign(emptyDb(),payload.new.data);
      localStorage.setItem(KEY,JSON.stringify(db));
      render();
    })
    .subscribe();
}
async function loadCloud(){
  if(!supabaseClient||!cloudUser)return false;
  await getProfile();
  if(!profile||!workspaceId){cloudReady=false;render();return false}
  if(!PERMS[role()]){cloudReady=false;render();return false}
  const localBefore=JSON.parse(localStorage.getItem(KEY)||'null')||emptyDb();
  const {data,error}=await supabaseClient.from('isp_workspaces').select('data').eq('user_id',workspaceId).maybeSingle();
  if(error){console.error('Cloud workspace load failed',error);cloudReady=false;render();throw new Error('Cloud workspace load failed: '+error.message);}
  cloudReady=true;
  if(data?.data){
    db=mergeCloudDb(localBefore,data.data);
    localStorage.setItem(KEY,JSON.stringify(db));
    await syncCloud();
  }else if(canEditData()){
    await syncCloud();
  }
  subscribeCloud();
  render();
  return true;
}
async function authLogin(email,password){
  if(!supabaseClient) throw new Error('Supabase client is not available. Open Settings and test the Cloud connection.');
  email=String(email||'').trim(); password=String(password||'');
  if(!email||!password) throw new Error('Enter your full email address and password.');
  let lastErr=null;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error) throw error;
      if(!data?.user||!data?.session) throw new Error('Supabase did not return a login session.');
      cloudUser=data.user;
      const ok=await loadCloud();
      if(!ok) throw new Error('Login succeeded, but the ISP workspace could not be loaded. Run the included SQL in Supabase and check RLS policies.');
      toast('Login successful'); return;
    }catch(e){
      lastErr=e;
      const msg=String(e?.message||e);
      if(!/NetworkError|Failed to fetch|Load failed|fetch/i.test(msg)||attempt===3) break;
      await new Promise(r=>setTimeout(r,700*attempt));
    }
  }
  const msg=String(lastErr?.message||lastErr||'Unknown error');
  if(/NetworkError|Failed to fetch|Load failed|fetch/i.test(msg))
    throw new Error('Cannot reach Supabase. Check the Project URL, internet/VPN, DNS, Safari content blockers, and run Settings → Test Cloud Connection.');
  throw new Error(msg);
}
async function authSignup(email,password){
  if(!supabaseClient) throw new Error('Supabase client is not available. Open Settings and test the Cloud connection.');
  email=String(email||'').trim(); password=String(password||'');
  if(!email||!password) throw new Error('Enter your full email address and a password.');
  if(password.length<6) throw new Error('Password must be at least 6 characters.');
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error) throw error;
  if(data?.session&&data?.user){
    cloudUser=data.user;
    const ok=await loadCloud();
    if(!ok) throw new Error('Account was created, but the ISP workspace could not be loaded. Run the included SQL in Supabase and check RLS.');
    toast('Account created and logged in.');
  }else{
    cloudUser=null; profile=null; workspaceId=null; cloudReady=false; render();
    toast('Account created. Check your email to confirm the account, then login.');
  }
}
async function authLogout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  cloudUser=null; profile=null; workspaceId=null; cloudReady=false;
  if(cloudChannel){try{await supabaseClient.removeChannel(cloudChannel)}catch(e){} cloudChannel=null;}
  toast('Logged out'); render();
}
async function createInvite(email,roleName,days){if(!supabaseClient||!cloudUser)throw new Error('Login first');const {data,error}=await supabaseClient.rpc('create_staff_invite',{p_email:email||null,p_role:roleName,p_expires_days:Number(days||7)});if(error)throw error;return data}
async function claimInvite(token){if(!supabaseClient||!cloudUser)throw new Error('Login first');const {data,error}=await supabaseClient.rpc('claim_staff_invite',{p_token:token});if(error)throw error;await loadCloud();return data}

function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const views=[['dashboard','⌂','Dashboard'],['companies','▦','Companies'],['customers','♙','Customers'],['packages','▣','Supplier Packages'],['billing','₨','Billing & Invoices'],['payments','✓','Payments'],['expenses','−','Expenses'],['staff','♟','Staff Management'],['reports','◉','Reports & Profit'],['import','⇧','Excel / CSV Import'],['devices','◉','Device Management'],['settings','⚙','Settings']];
function nav(){document.getElementById('nav').innerHTML=views.filter(v=>can(v[0])).map(v=>`<button class="${view===v[0]?'active':''}" data-view="${v[0]}">${v[1]} &nbsp; ${v[2]}</button>`).join('')}
function fillFilter(){const s=document.getElementById('companyFilter');s.innerHTML='<option value="all">All Companies</option>'+db.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');s.value=filter;}
function companyName(id){return db.companies.find(c=>c.id===id)?.name||'—'}
function packageOf(id){return db.packages.find(p=>p.id===id)}
function customers(){return filter==='all'?db.customers:db.customers.filter(c=>c.companyId===filter)}
function packages(){return filter==='all'?db.packages:db.packages.filter(p=>p.companyId===filter)}
function invoices(){return filter==='all'?db.invoices:db.invoices.filter(i=>i.companyId===filter)}
function metrics(){const cs=customers(), ins=invoices(); const sales=cs.filter(c=>c.status!=='Suspended').reduce((a,c)=>a+Number(c.retail||packageOf(c.packageId)?.retail||0),0); const collected=ins.reduce((a,i)=>a+Number(i.paid||0),0); const supplier=cs.filter(c=>c.status!=='Suspended').reduce((a,c)=>a+Number(packageOf(c.packageId)?.cost||0),0); const exp=db.expenses.filter(e=>filter==='all'||e.companyId===filter).reduce((a,e)=>a+Number(e.amount||0),0); const staff=db.staff.filter(s=>s.active!==false&&(filter==='all'||s.companyId===filter)).reduce((a,s)=>a+Number(s.salary||0),0); const outstanding=Math.max(0,sales-collected); return{cs,sales,collected,supplier,commission:sales-supplier,expenses:exp+staff,net:sales-supplier-exp-staff,outstanding}}
function render(){if(!can(view))view=can('dashboard')?'dashboard':'settings';nav();fillFilter();document.getElementById('roleTop').textContent=role().toUpperCase();document.getElementById('userTop').textContent=cloudUser?.email||'Local';const el=document.getElementById('content');el.innerHTML=page(view);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;closeMobile();render()});wire();if(view==='dashboard')requestAnimationFrame(renderCharts);if(view==='customerDetail'&&viewCustomerId)requestAnimationFrame(()=>renderClientCharts(viewCustomerId));}
function page(v){if(!can(v))return head('Access Restricted','Your staff account does not have permission to view this section.')+'<div class="card"><div class="empty">Ask an administrator to grant the required permission.</div></div></div>';switch(v){case'companies':return companiesPage();case'customers':return customersPage();case'customerDetail':return customerDetailPage(viewCustomerId);case'packages':return packagesPage();case'billing':return billingPage();case'payments':return paymentsPage();case'expenses':return expensesPage();case'staff':return staffPage();case'reports':return reportsPage();case'import':return importPage();case'devices':return deviceManagementPage();case'settings':return settingsPage();default:return dashboardPage()}}
function head(title,desc,buttons=''){return `<div class="page"><div class="title"><div><div class="actions" style="margin-bottom:10px"><button type="button" class="btn small" data-back>← Back</button><button type="button" class="btn small" data-home>⌂ Dashboard</button></div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}

x">Live charts use your invoices, payments and customer records. Daily = last 7 days; weekly = last 8 weeks.</p></div><div class="actions" style="align-items:center"><label class="subtle">Daily payment target</label><input id="dailyTargetInput" type="number" min="0" step="100" value="${dailyPaymentTarget()}" style="width:150px" onchange="setDailyTarget(this.value)"><span class="subtle">/ day</span></div></div><div class="chartgrid"><div class="card chartcard"><h2>Payments Received vs Pending</h2><div class="chartwrap"><canvas id="paymentStatusChart"></canvas></div></div><div class="card chartcard"><h2>Daily Payments Received</h2><div class="chartwrap"><canvas id="dailyPaymentsChart"></canvas></div></div><div class="card chartcard"><h2>Daily Target / Progress %</h2><div class="chartwrap"><canvas id="dailyInvoicesChart"></canvas></div></div><div class="card chartcard"><h2>Weekly Revenue</h2><div class="chartwrap"><canvas id="weeklyRevenueChart"></canvas></div></div><div class="card chartcard"><h2>Weekly Payments Received</h2><div class="chartwrap"><canvas id="weeklyPaymentsChart"></canvas></div></div><div class="card chartcard"><h2>Weekly New Customers</h2><div class="chartwrap"><canvas id="weeklyCustomersChart"></canvas></div></div><div class="card chartcard"><h2>This Week vs Last Week</h2><div class="chartwrap"><canvas id="weeklyComparisonChart"></canvas></div></div></div></div><div class="card section"><h2>Live Data</h2><div class="grid"><div class="card metric"><div class="label">Companies</div><div class="value">${db.companies.length}</div><div class="blue">Supplier companies</div></div><div class="card metric"><div class="label">Customers</div><div class="value">${db.customers.length}</div><div class="blue">All customer accounts</div></div><div class="card metric"><div class="label">Packages</div><div class="value">${db.packages.length}</div><div class="blue">Supplier packages</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Company</th><th>Customers</th><th>Packages</th><th>Monthly Revenue</th><th>Commission</th></tr></thead><tbody>${db.companies.length?db.companies.map(c=>{const cc=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended');const rev=cc.reduce((a,x)=>a+Number(x.retail||packageOf(x.packageId)?.retail||0),0);const cost=cc.reduce((a,x)=>a+Number(packageOf(x.packageId)?.cost||0),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${cc.length}</td><td>${db.packages.filter(p=>p.companyId===c.id).length}</td><td>${money(rev)}</td><td class="green">${money(rev-cost)}</td></tr>`}).join(''):`<tr><td colspan="5"><div class="empty">No companies yet. Add a company and it will appear here immediately.</div></td></tr>`}</tbody></table></div></div><div class="twocol section"><div class="card"><h2>How your billing works</h2><div class="profitrow"><span>Supplier package cost</span><b>${money(m.supplier)}</b></div><div class="profitrow"><span>Customer retail sales</span><b>${money(m.sales)}</b></div><div class="profitrow"><span>Gross commission</span><b class="green">${money(m.commission)}</b></div><div class="profitrow"><span>Other expenses + salaries</span><b>${money(m.expenses)}</b></div><div class="profitrow"><span>Net profit</span><b class="green">${money(m.net)}</b></div></div><div class="card"><h2>Quick actions</h2><div class="actions">${can('packages')?'<button class="btn primary" data-open="package">+ Supplier Package</button>':''}<button class="btn" data-open="payment">+ Receive Payment</button><button class="btn" data-view="reports">View Profit Report</button></div><p class="subtle" style="margin-top:18px">No MikroTik or ZalPro connection is required. You can run this as your own reseller billing database and import your existing data from Excel/CSV.</p></div></div></div>`}

function chartDate(d){return new Date(d+'T12:00:00')}
function dateKey(d){return d.toISOString().slice(0,10)}
function fmtDay(d){return d.toLocaleDateString('en-PK',{day:'2-digit',month:'short'})}
function chartMoney(v){return 'Rs. '+Number(v||0).toLocaleString('en-PK',{maximumFractionDigits:0})}
function inCurrentFilterCompany(id){return filter==='all'||id===filter}
function chartPaymentStatusData(){let received=0,pending=0;db.invoices.filter(i=>inCurrentFilterCompany(i.companyId)).forEach(i=>{received+=Number(i.paid||0);pending+=Math.max(0,Number(i.retail||0)-Number(i.paid||0))});return [received,pending]}
function lastDays(n){const out=[];const now=new Date();now.setHours(12,0,0,0);for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);out.push(d)}return out}
function weekStart(d){const x=new Date(d);x.setHours(12,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function lastWeeks(n){const cur=weekStart(new Date()),out=[];for(let i=n-1;i>=0;i--){const d=new Date(cur);d.setDate(cur.getDate()-i*7);out.push(d)}return out}
function dailyPaymentTarget(){const saved=Number(localStorage.getItem('nf_daily_payment_target')||0);if(saved>0)return saved;const m=metrics();return Math.round(Number(m.sales||0)/30)}
function setDailyTarget(v){const n=Math.max(0,Number(v||0));localStorage.setItem('nf_daily_payment_target',String(n));render()}
function renderCharts(){
  if(typeof Chart==='undefined')return;
  window.__nfCharts=window.__nfCharts||{};
  Object.values(window.__nfCharts).forEach(c=>{try{c.destroy()}catch(e){}});
  window.__nfCharts={};
  const green='#18c98b',red='#ff5f6d',blue='#3b9cff',amber='#f4b63f';
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#cbd5e4'}},tooltip:{callbacks:{label:ctx=>chartMoney(ctx.parsed.y??ctx.parsed)}}},scales:{x:{ticks:{color:'#91a0b8'},grid:{color:'rgba(145,160,184,.08)'}},y:{ticks:{color:'#91a0b8',callback:v=>chartMoney(v)},grid:{color:'rgba(145,160,184,.10)'}}}};
  const status=chartPaymentStatusData();
  window.__nfCharts.status=new Chart(document.getElementById('paymentStatusChart'),{type:'bar',data:{labels:['Received','Pending'],datasets:[{label:'Amount',data:status,backgroundColor:[green,red],borderRadius:8}]},options:{...base}});
  const days=lastDays(7),dayLabels=days.map(fmtDay),target=dailyPaymentTarget();
  const dailyPay=days.map(d=>{const k=dateKey(d);return db.payments.filter(p=>inCurrentFilterCompany(db.invoices.find(i=>i.id===p.invoiceId)?.companyId)).filter(p=>p.date===k).reduce((a,p)=>a+Number(p.amount||0),0)});
  const progress=days.map((d,i)=>target>0?Math.min(100,Math.round(dailyPay[i]/target*100)):0);
  window.__nfCharts.dailyPay=new Chart(document.getElementById('dailyPaymentsChart'),{type:'line',data:{labels:dayLabels,datasets:[{label:'Received',data:dailyPay,tension:.35,fill:true,borderColor:green,backgroundColor:'rgba(24,201,139,.12)'},{label:'Daily target',data:days.map(()=>target),tension:0,borderColor:amber,borderDash:[6,5],pointRadius:0}]},options:{...base}});
  window.__nfCharts.dailyInv=new Chart(document.getElementById('dailyInvoicesChart'),{type:'bar',data:{labels:dayLabels,datasets:[{label:'Progress %',data:progress,backgroundColor:green,borderRadius:7}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,min:0,max:100,ticks:{color:'#91a0b8',callback:v=>v+'%'}}},plugins:{...base.plugins,tooltip:{callbacks:{label:ctx=>`Progress: ${ctx.parsed.y}% (target ${chartMoney(target)})`}}}}});
  const weeks=lastWeeks(8),weekLabels=weeks.map(d=>fmtDay(d)),weekEnd=w=>{const e=new Date(w);e.setDate(e.getDate()+7);return e};
  const weeklyRevenue=weeks.map(w=>db.invoices.filter(i=>inCurrentFilterCompany(i.companyId)).filter(i=>{const raw=(i.createdDate||i.date||i.dueDate||'').slice(0,10);if(!raw)return false;const d=chartDate(raw);return d>=w&&d<weekEnd(w)}).reduce((a,i)=>a+Number(i.retail||0),0));
  const weeklyPayments=weeks.map(w=>db.payments.filter(p=>{const inv=db.invoices.find(i=>i.id===p.invoiceId);return inv&&inCurrentFilterCompany(inv.companyId)}).filter(p=>{const d=chartDate(p.date);return d>=w&&d<weekEnd(w)}).reduce((a,p)=>a+Number(p.amount||0),0));
  const weeklyCustomers=weeks.map(w=>db.customers.filter(c=>{const raw=(c.createdDate||c.date||'').slice(0,10);if(!raw)return false;const d=chartDate(raw);return d>=w&&d<weekEnd(w)}).length);
  window.__nfCharts.weekRev=new Chart(document.getElementById('weeklyRevenueChart'),{type:'line',data:{labels:weekLabels,datasets:[{label:'Revenue',data:weeklyRevenue,tension:.35,borderColor:blue,backgroundColor:'rgba(59,156,255,.10)',fill:true}]},options:{...base}});
  window.__nfCharts.weekPay=new Chart(document.getElementById('weeklyPaymentsChart'),{type:'bar',data:{labels:weekLabels,datasets:[{label:'Payments received',data:weeklyPayments,backgroundColor:green,borderRadius:7}]},options:{...base}});
  window.__nfCharts.weekCust=new Chart(document.getElementById('weeklyCustomersChart'),{type:'line',data:{labels:weekLabels,datasets:[{label:'New customers',data:weeklyCustomers,tension:.35,borderColor:amber,backgroundColor:'rgba(244,182,63,.10)',fill:true}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{color:'#91a0b8',stepSize:1}}}}});
  const currentWeek=weeks[weeks.length-1],previousWeek=weeks[weeks.length-2];
  const sumWeek=(arr,w)=>{const idx=weeks.findIndex(x=>x.getTime()===w.getTime());return idx>=0?arr[idx]:0};
  const comparisonLabels=['Revenue','Payments'];
  const thisWeek=[sumWeek(weeklyRevenue,currentWeek),sumWeek(weeklyPayments,currentWeek)];
  const lastWeek=[sumWeek(weeklyRevenue,previousWeek),sumWeek(weeklyPayments,previousWeek)];
  window.__nfCharts.weekCompare=new Chart(document.getElementById('weeklyComparisonChart'),{type:'bar',data:{labels:comparisonLabels,datasets:[{label:'This week',data:thisWeek,backgroundColor:green,borderRadius:7},{label:'Last week',data:lastWeek,backgroundColor:blue,borderRadius:7}]},options:{...base}});
}
function companiesPage(){return head('Companies / Suppliers','The companies that give you internet packages.',`<button class="btn primary" data-open="company">+ Add Company</button>`)+`<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Company</th><th>Contact</th><th>Packages</th><th>Customers</th><th>Monthly Cost</th><th>Actions</th></tr></thead><tbody>${db.companies.length?db.companies.map(c=>{const ps=db.packages.filter(p=>p.companyId===c.id).length,cs=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended').length,cost=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended').reduce((a,x)=>a+Number(packageOf(x.packageId)?.cost||0),0);return `<tr><td><b>${esc(c.name)}</b><br><span class="subtle">${esc(c.code||'')}</span></td><td>${esc(c.phone||'—')}<br>${esc(c.email||'')}</td><td>${ps}</td><td>${cs}</td><td>${money(cost)}</td><td><button class="btn small" data-edit-company="${c.id}">Edit</button> <button class="btn small danger" data-delete-company="${c.id}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">No supplier companies yet. Add the first company.</div></td></tr>`}</tbody></table></div></div></div>`}
function customerBillingStatus(c){
  const inv=db.invoices.filter(i=>i.customerId===c.id);
  if(!inv.length)return 'no-invoice';
  const due=inv.reduce((a,i)=>a+Math.max(0,Number(i.retail||0)-Number(i.paid||0)),0);
  const paid=inv.reduce((a,i)=>a+Number(i.paid||0),0);
  if(due<=0)return 'paid';
  return paid>0?'partial':'unpaid';
}
function customersPage(){

  const counts={all:all.length,paid:all.filter(c=>customerBillingStatus(c)==='paid').length,unpaid:all.filter(c=>customerBillingStatus(c)==='unpaid').length,partial:all.filter(c=>customerBillingStatus(c)==='partial').length,'no-invoice':all.filter(c=>customerBillingStatus(c)==='no-invoice').length};

    <div class="card metric"><div class="label">Unpaid Customers</div><div class="value red">${counts.unpaid}</div><div class="red">Full balance pending</div></div>
    <div class="card metric"><div class="label">Partial</div><div class="value amber">${counts.partial}</div><div class="amber">Payment received, balance remains</div></div>
  </div>
  <div class="card section"><div class="actions" style="flex-wrap:wrap">${btn('all','All')}${btn('paid','Paid','success')}${btn('unpaid','Unpaid','danger')}${btn('partial','Partial')}${btn('no-invoice','No Invoice')}</div></div>
  <div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Company</th><th>Package</th><th>Speed</th><th>Retail</th>${canSeeCosts()?'<th>Supplier Cost</th><th>Commission</th>':''}<th>Paid</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>${cs.length?cs.map(c=>{const p=packageOf(c.packageId),ret=Number(c.retail||0),cost=Number(p?.cost||0),inv=db.invoices.filter(i=>i.customerId===c.id),paid=inv.reduce((a,i)=>a+Number(i.paid||0),0),due=inv.reduce((a,i)=>a+Math.max(0,Number(i.retail||0)-Number(i.paid||0)),0),st=customerBillingStatus(c);return `<tr><td><b>${esc(c.name)}</b><br><span class="subtle">${esc(c.username||'')} ${esc(c.phone||'')}</span></td><td>${esc(companyName(c.companyId))}</td><td>${esc(p?.name||'—')}</td><td class="blue"><b>${esc(p?.bandwidth||'—')}</b></td><td>${money(ret)}</td>${canSeeCosts()?`<td>${money(cost)}</td><td class="green">${money(ret-cost)}</td>`:''}<td class="green">${money(paid)}</td><td class="${due>0?'red':'green'}">${money(due)}</td><td><span class="badge ${st==='paid'?'paid':st==='unpaid'?'unpaid':st==='partial'?'partial':'neutral'}">${st.replace('-', ' ').toUpperCase()}</span></td><td><button class="btn small primary" data-view-customer="${c.id}">View</button> <button class="btn small" data-edit-customer="${c.id}">Edit</button> <button class="btn small success" data-customer-invoice="${c.id}">Invoice</button> <button class="btn small" data-generate-bill="${c.id}">Bill</button> <button class="btn small danger" data-delete-customer="${c.id}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="12"><div class="empty">No customers in this category.</div></td></tr>`}</tbody></table></div></div></div>`
}
function speedMbps(value){const m=String(value||'').trim().match(/([0-9]+(?:\.[0-9]+)?)\s*(gbps|mbps|kbps)/i);if(!m)return 0;const n=Number(m[1]),u=m[2].toLowerCase();return u==='gbps'?n*1000:u==='kbps'?n/1000:n}
function customerDetailPage(id){const c=db.customers.find(x=>x.id===id);if(!c)return head('Customer not found','The selected customer no longer exists.')+'<div class="card"><div class="empty">Customer not found.</div></div>';const p=packageOf(c.packageId), inv=db.invoices.filter(i=>i.customerId===id), pays=db.payments.filter(x=>x.customerId===id).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))),paid=pays.reduce((a,x)=>a+Number(x.amount||0),0),billed=inv.reduce((a,x)=>a+Number(x.retail||0),0),due=Math.max(0,billed-paid);return head('Client: '+esc(c.name),'Payment history and internet speed overview.',`<button class="btn" data-edit-customer="${c.id}">Edit Client</button><button class="btn success" data-customer-invoice="${c.id}">+ Invoice</button><button class="btn primary" data-generate-bill="${c.id}">Generate Bill</button>`)+`<div class="clientProfile"><div class="card metric"><div class="label">Current Speed</div><div class="value blue">${esc(p?.bandwidth||'—')}</div><div class="subtle">${esc(p?.name||'No package')}</div></div><div class="card metric"><div class="label">Total Billed</div><div class="value">${money(billed)}</div><div class="subtle">All invoices</div></div><div class="card metric"><div class="label">Payment Received</div><div class="value green">${money(paid)}</div><div class="green">${pays.length} payment(s)</div></div><div class="card metric"><div class="label">Pending</div><div class="value red">${money(due)}</div><div class="red">Outstanding balance</div></div></div><div class="card section"><h2>Client Analytics</h2><div class="clientCharts"><div class="card clientChart"><h2>Payment History</h2><div class="chartwrap"><canvas id="clientPaymentChart"></canvas></div></div><div class="card clientChart"><h2>Internet Speed</h2><div class="chartwrap"><canvas id="clientSpeedChart"></canvas></div><p class="subtle" style="margin:8px 0 0">Speed is shown in Mbps. Speed changes are recorded when the client package speed changes.</p></div></div></div><div class="card section"><h2>Client Information</h2><div class="twocol"><div><div class="profitrow"><span>Name</span><b>${esc(c.name)}</b></div><div class="profitrow"><span>Username</span><b>${esc(c.username||'—')}</b></div><div class="profitrow"><span>Phone</span><b>${esc(c.phone||'—')}</b></div><div class="profitrow"><span>Status</span><b>${esc(c.status||'Active')}</b></div></div><div><div class="profitrow"><span>Company</span><b>${esc(companyName(c.companyId))}</b></div><div class="profitrow"><span>Package</span><b>${esc(p?.name||'—')}</b></div><div class="profitrow"><span>Monthly Retail</span><b>${money(c.retail||p?.retail||0)}</b></div><div class="profitrow"><span>Billing Day</span><b>${esc(c.billingDay||1)}</b></div></div></div></div><div class="card section"><h2>Payment Records</h2><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Invoice</th><th>Note</th></tr></thead><tbody>${pays.length?pays.slice().reverse().map(x=>`<tr><td>${esc(x.date||'—')}</td><td class="green">${money(x.amount)}</td><td>${esc(x.method||'—')}</td><td>${esc(db.invoices.find(i=>i.id===x.invoiceId)?.no||'—')}</td><td>${esc(x.note||'—')}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No payments recorded for this client.</div></td></tr>`}</tbody></table></div></div></div>`}
function renderClientCharts(id){if(!window.Chart)return;window.__nfCharts=window.__nfCharts||{};['clientPayment','clientSpeed'].forEach(k=>{if(window.__nfCharts[k])window.__nfCharts[k].destroy()});const c=db.customers.find(x=>x.id===id);if(!c)return;const p=packageOf(c.packageId),pays=db.payments.filter(x=>x.customerId===id).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));const map={};pays.forEach(x=>{const d=x.date||'Unknown';map[d]=(map[d]||0)+Number(x.amount||0)});const labels=Object.keys(map).slice(-12),vals=labels.map(x=>map[x]);const history=Array.isArray(c.speedHistory)&&c.speedHistory.length?c.speedHistory:[{date:c.createdDate||today(),speed:speedMbps(p?.bandwidth)}];const sl=history.map(x=>x.date||'Current'),sd=history.map(x=>Number(x.speed||0));const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#d8e1ef'}}},scales:{x:{ticks:{color:'#91a0b8'},grid:{color:'rgba(145,160,184,.08)'}},y:{ticks:{color:'#91a0b8'},grid:{color:'rgba(145,160,184,.08)'}}}};const payEl=document.getElementById('clientPaymentChart'),speedEl=document.getElementById('clientSpeedChart');if(payEl)window.__nfCharts.clientPayment=new Chart(payEl,{type:'line',data:{labels,datasets:[{label:'Payment received',data:vals,borderColor:'#18c98b',backgroundColor:'rgba(24,201,139,.12)',fill:true,tension:.35}]},options:{...base}});if(speedEl)window.__nfCharts.clientSpeed=new Chart(speedEl,{type:'line',data:{labels:sl,datasets:[{label:'Speed (Mbps)',data:sd,borderColor:'#3b9cff',backgroundColor:'rgba(59,156,255,.12)',fill:true,tension:.35,stepped:true}]},options:{...base,scales:{...base.scales,y:{...base.scales.y,beginAtZero:true,title:{display:true,text:'Mbps',color:'#91a0b8'}}}}})}

function deviceManagementPage(){

function csv(rows){if(!rows.length)return '';const keys=Object.keys(rows[0]);return [keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}

async function adapterFetch(path,options={}){
  const base=(window.NETFLOW_ADAPTER_URL||'').replace(/\/$/,'');
  const url=(base?base:'')+path;
  const r=await fetch(url,{...options,headers:{'Accept':'application/json','Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});
  if(!r.ok){let msg='HTTP '+r.status;try{const j=await r.json();msg=j.detail||j.error||msg}catch{}throw new Error(msg)}
  return r.json();
}
async function refreshDeviceTelemetry(id,silent=false){
  const d=(db.devices||[]).find(x=>x.id===id); if(!d)return;
  const url=d.adapterId?('/api/olts/'+encodeURIComponent(d.adapterId)+'/live?refresh=true'):(d.adapterUrl||d.monitoringUrl);
  if(!url){if(!silent)toast('Configure the VSOL monitoring adapter for this OLT first.');return;}
  try{
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
    const r=await fetch(url,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store',signal:controller.signal});clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    d.lastTelemetry={...data,status:data.status||'online',updatedAt:new Date().toISOString()};
    localStorage.setItem(KEY,JSON.stringify(db));render();if(!silent)toast('Live VSOL telemetry refreshed');
  }catch(e){
    d.lastTelemetry={...(d.lastTelemetry||{}),status:'offline',updatedAt:new Date().toISOString(),error:String(e?.message||e)};
    localStorage.setItem(KEY,JSON.stringify(db));render();if(!silent)toast('Monitoring adapter unavailable: '+String(e?.message||e));
  }
}
