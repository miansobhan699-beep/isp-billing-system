<style>
:root{--bg:#060a14;--panel:#0b1220;--panel2:#0e1728;--line:#1d2a40;--text:#e9eef7;--muted:#91a0b8;--purple:#7c3cff;--purple2:#a66bff;--green:#18c98b;--red:#ff5f6d;--amber:#f4b63f;--blue:#3b9cff;--shadow:0 18px 50px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#17214b 0,#060a14 45%);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:260px;flex:0 0 260px;background:#070d18;border-right:1px solid var(--line);padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:20;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 22px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#6e2cff,#b17cff);display:grid;place-items:center;font-weight:900;font-size:18px}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd5e4;text-align:left;padding:12px 13px;border-radius:10px}.nav button:hover,.nav button.active{background:#291052;color:#fff}.filterbox{margin-top:18px;border:1px solid var(--line);border-radius:13px;padding:13px}.filterbox label{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}.filterbox select{width:100%}.main{margin-left:260px;min-width:0;flex:1}.topbar{height:74px;border-bottom:1px solid var(--line);background:rgba(5,9,18,.9);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:15}.hamb{display:none;background:none;border:0;color:#fff;font-size:25px}.search{width:min(510px,60vw);background:#080f1d;border:1px solid #25344d;color:#fff;padding:11px 13px;border-radius:9px}.topspacer{flex:1}.page{padding:28px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.title h1{font-size:27px;margin:0}.title p{margin:7px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #33445f;background:#101a2b;color:#fff;border-radius:8px;padding:10px 14px}.btn.primary{background:linear-gradient(135deg,#7132ff,#9855ff);border-color:#9c67ff}.btn.success{background:#0d8f68;border-color:#17bd8d}.btn.danger{background:#7d2430;border-color:#b93645}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#0c1525,#09111e);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:26px;font-weight:800;margin:9px 0}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #1b273a;text-align:left;white-space:nowrap}.table th{color:#91a0b8;font-size:12px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px}.badge.paid{background:#0b543f;color:#62e9ba}.badge.unpaid{background:#57232a;color:#ff9aa2}.badge.partial{background:#5a441b;color:#ffd27c}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modalback.show{display:flex}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0b1423;border:1px solid #2b3a53;border-radius:14px;padding:20px;box-shadow:0 25px 80px #000}.modal h2{margin:0 0 16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;color:#9ca9bd;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#07101d;border:1px solid #2b3a53;color:#fff;border-radius:8px;padding:10px}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{padding:12px 14px;border:1px solid #28415f;border-radius:9px;background:#0b1626;color:#b9c7db}.kpi{display:flex;justify-content:space-between;gap:15px;align-items:center}.pill{font-size:11px;color:#b7c3d6}.subtle{color:var(--muted)}.profitrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b273a}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#122139;border:1px solid #2f4564;padding:12px 16px;border-radius:9px;display:none}.toast.show{display:block}.mobileOverlay{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:280px}.sidebar.open{transform:none}.main{margin-left:0}.hamb{display:block}.topbar{padding:0 12px;height:64px}.search{width:100%;max-width:none}.topspacer{display:none}.page{padding:18px 12px}.title{display:block}.title h1{font-size:23px}.actions{margin-top:14px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.mobileOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}.mobileOverlay.show{display:block}}

.roleBadge{display:inline-block;padding:5px 9px;border-radius:999px;background:#21103f;color:#c9a8ff;font-size:11px;font-weight:700;text-transform:uppercase}.locked{opacity:.62}.permgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.perm{border:1px solid var(--line);border-radius:10px;padding:12px;background:#091221}.invitebox{border:1px dashed #5c43a8;padding:14px;border-radius:10px;background:#0b1220}.code{font-family:ui-monospace,SFMono-Regular,monospace;word-break:break-all;background:#050a12;padding:10px;border-radius:8px;border:1px solid var(--line)}@media(max-width:760px){.permgrid{grid-template-columns:1fr}}

<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">NF</div><div><b>NetFlow ISP</b><small>Reseller Billing System</small></div></div><nav class="nav" id="nav"></nav><div class="filterbox"><label>COMPANY FILTER</label><select id="companyFilter"></select></div></aside><div class="mobileOverlay" id="overlay"></div><main class="main"><header class="topbar"><button class="hamb" id="hamb">☰</button><input class="search" id="globalSearch" placeholder="Search customer, company, package, invoice..."><div class="topspacer"></div><span id="clock" class="subtle"></span><span>🔔</span><span id="roleTop" class="roleBadge">OWNER</span><span id="userTop">Admin</span><b class="logo" style="width:36px;height:36px;border-radius:50%;font-size:13px">MS</b></header><div id="content"></div></main></div>
<div class="modalback" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='netflow_reseller_billing_v14';
const SUPABASE_URL_KEY='netflow_supabase_url';
const SUPABASE_ANON_KEY='netflow_supabase_anon';
// Supabase browser-safe configuration. The publishable key is safe to expose in a static GitHub Pages app;
// database access is protected by the RLS policies in supabase_setup.sql.
const DEFAULT_SUPABASE_URL='https://ejpvhkknjemmlpfdrinx.supabase.co';
const DEFAULT_SUPABASE_PUBLISHABLE_KEY='sb_publishable_GbqwdbcwzK3uD6QYbEifmQ_ZUa6TLIc';
let supabaseClient=null, cloudUser=null, cloudBusy=false, cloudReady=false, cloudChannel=null; let profile=null; let workspaceId=null; if(!getSupabase()) profile={role:'owner'};
function getSupabase(){
  const url=localStorage.getItem(SUPABASE_URL_KEY)||DEFAULT_SUPABASE_URL; const key=localStorage.getItem(SUPABASE_ANON_KEY)||DEFAULT_SUPABASE_PUBLISHABLE_KEY;
  if(!url||!key||!window.supabase) return null;
  try{return window.supabase.createClient(url,key)}catch(e){return null}
}
function configureCloud(url,key){localStorage.setItem(SUPABASE_URL_KEY,(url||DEFAULT_SUPABASE_URL).trim());localStorage.setItem(SUPABASE_ANON_KEY,(key||DEFAULT_SUPABASE_PUBLISHABLE_KEY).trim());supabaseClient=getSupabase();}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{companies:[],packages:[],customers:[],invoices:[],payments:[],expenses:[],staff:[]};
let view='dashboard'; let filter='all';
function save(){localStorage.setItem(KEY,JSON.stringify(db));render(); if(cloudReady && cloudUser && workspaceId) syncCloud();}
function role(){const r=String(profile?.role||'').toLowerCase(); return PERMS[r]?r:'owner'}
const PERMS={
  owner:['dashboard','companies','customers','packages','billing','payments','expenses','staff','reports','import','settings'],
  admin:['dashboard','companies','customers','packages','billing','payments','expenses','staff','reports','import','settings'],
  manager:['dashboard','companies','customers','packages','billing','payments','expenses','reports','import'],
  billing:['dashboard','customers','billing','payments'],
  support:['dashboard','customers'],
  unassigned:[]
};
function can(v){return (PERMS[role()]||[]).includes(v)}
function canSeeCosts(){return ['owner','admin','manager'].includes(role())}
function canManageStaff(){return ['owner','admin'].includes(role())}
function canEditData(){return ['owner','admin','manager','billing'].includes(role())}
async function getProfile(){if(!supabaseClient||!cloudUser)return null;const {data,error}=await supabaseClient.from('isp_profiles').select('*').eq('user_id',cloudUser.id).maybeSingle();if(error){console.error(error);return null}profile=data||null;workspaceId=profile?.workspace_id||null;return profile}
function emptyDb(){return {companies:[],packages:[],customers:[],invoices:[],payments:[],expenses:[],staff:[]}}
function mergeCloudDb(localData,remoteData){
  const out=emptyDb();
  Object.keys(out).forEach(k=>{
    const local=Array.isArray(localData?.[k])?localData[k]:[];
    const remote=Array.isArray(remoteData?.[k])?remoteData[k]:[];
    const map=new Map();
    remote.forEach(x=>map.set(String(x.id),x));
    local.forEach(x=>{if(x?.id && !map.has(String(x.id)))map.set(String(x.id),x);});
    out[k]=Array.from(map.values());
  });
  return out;
}
async function syncCloud(){
  if(!supabaseClient||!cloudUser||!cloudReady||cloudBusy||!workspaceId)return;
  cloudBusy=true;
  try{
    const {error}=await supabaseClient.from('isp_workspaces').upsert(
      {user_id:workspaceId,data:db,updated_at:new Date().toISOString()},
      {onConflict:'user_id'}
    );
    if(error)throw error;
  }catch(e){console.error(e);toast('Cloud sync failed: '+(e.message||'Check Supabase/RLS'));}finally{cloudBusy=false;}
}
function subscribeCloud(){
  if(!supabaseClient||!workspaceId)return;
  if(cloudChannel){supabaseClient.removeChannel(cloudChannel);cloudChannel=null;}
  cloudChannel=supabaseClient.channel('netflow-workspace-'+workspaceId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'isp_workspaces',filter:'user_id=eq.'+workspaceId},payload=>{
      if(!payload?.new?.data)return;
      db=Object.assign(emptyDb(),payload.new.data);
      localStorage.setItem(KEY,JSON.stringify(db));
      render();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'isp_workspaces',filter:'user_id=eq.'+workspaceId},payload=>{
      if(!payload?.new?.data)return;
      db=Object.assign(emptyDb(),payload.new.data);
      localStorage.setItem(KEY,JSON.stringify(db));
      render();
    })
    .subscribe();
}
async function loadCloud(){
  if(!supabaseClient||!cloudUser)return false;
  await getProfile();
  if(!profile||!workspaceId){cloudReady=false;render();return false}
  if(!PERMS[role()]){cloudReady=false;render();return false}
  const localBefore=JSON.parse(localStorage.getItem(KEY)||'null')||emptyDb();
  const {data,error}=await supabaseClient.from('isp_workspaces').select('data').eq('user_id',workspaceId).maybeSingle();
  if(error){console.error(error);cloudReady=false;toast('Cloud load failed: '+error.message);render();return false;}
  cloudReady=true;
  if(data?.data){
    db=mergeCloudDb(localBefore,data.data);
    localStorage.setItem(KEY,JSON.stringify(db));
    await syncCloud();
  }else if(canEditData()){
    await syncCloud();
  }
  subscribeCloud();
  render();
  return true;
}
async function authLogin(email,password){if(!supabaseClient)throw new Error('Cloud is not configured');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;cloudUser=data.user;await loadCloud();toast('Login successful')}
async function authSignup(email,password){if(!supabaseClient)throw new Error('Cloud is not configured');const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)throw error;if(data.user){cloudUser=data.user;await getProfile();render();toast('Account created. If this is a staff account, claim your invite token.')}}
async function authLogout(){if(supabaseClient)await supabaseClient.auth.signOut();cloudUser=null;profile=null;workspaceId=null;cloudReady=false;toast('Logged out');render()}
async function createInvite(email,roleName,days){if(!supabaseClient||!cloudUser)throw new Error('Login first');const {data,error}=await supabaseClient.rpc('create_staff_invite',{p_email:email||null,p_role:roleName,p_expires_days:Number(days||7)});if(error)throw error;return data}
async function claimInvite(token){if(!supabaseClient||!cloudUser)throw new Error('Login first');const {data,error}=await supabaseClient.rpc('claim_staff_invite',{p_token:token});if(error)throw error;await loadCloud();return data}

function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
const views=[['dashboard','⌂','Dashboard'],['companies','▦','Companies'],['customers','♙','Customers'],['packages','▣','Supplier Packages'],['billing','₨','Billing & Invoices'],['payments','✓','Payments'],['expenses','−','Expenses'],['staff','♟','Staff Management'],['reports','◉','Reports & Profit'],['import','⇧','Excel / CSV Import'],['settings','⚙','Settings']];
function nav(){document.getElementById('nav').innerHTML=views.filter(v=>can(v[0])).map(v=>`<button class="${view===v[0]?'active':''}" data-view="${v[0]}">${v[1]} &nbsp; ${v[2]}</button>`).join('')}
function fillFilter(){const s=document.getElementById('companyFilter');s.innerHTML='<option value="all">All Companies</option>'+db.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');s.value=filter;}
function companyName(id){return db.companies.find(c=>c.id===id)?.name||'—'}
function packageOf(id){return db.packages.find(p=>p.id===id)}
function customers(){return filter==='all'?db.customers:db.customers.filter(c=>c.companyId===filter)}
function packages(){return filter==='all'?db.packages:db.packages.filter(p=>p.companyId===filter)}
function invoices(){return filter==='all'?db.invoices:db.invoices.filter(i=>i.companyId===filter)}
function metrics(){const cs=customers(), ins=invoices(); const sales=cs.filter(c=>c.status!=='Suspended').reduce((a,c)=>a+Number(c.retail||packageOf(c.packageId)?.retail||0),0); const collected=ins.reduce((a,i)=>a+Number(i.paid||0),0); const supplier=cs.filter(c=>c.status!=='Suspended').reduce((a,c)=>a+Number(packageOf(c.packageId)?.cost||0),0); const exp=db.expenses.filter(e=>filter==='all'||e.companyId===filter).reduce((a,e)=>a+Number(e.amount||0),0); const staff=db.staff.filter(s=>s.active!==false&&(filter==='all'||s.companyId===filter)).reduce((a,s)=>a+Number(s.salary||0),0); const outstanding=Math.max(0,sales-collected); return{cs,sales,collected,supplier,commission:sales-supplier,expenses:exp+staff,net:sales-supplier-exp-staff,outstanding}}
function render(){if(!can(view))view=can('dashboard')?'dashboard':'settings';nav();fillFilter();document.getElementById('roleTop').textContent=role().toUpperCase();document.getElementById('userTop').textContent=cloudUser?.email||'Local';const el=document.getElementById('content');el.innerHTML=page(view);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;closeMobile();render()});wire();}
function page(v){if(!can(v))return head('Access Restricted','Your staff account does not have permission to view this section.')+'<div class="card"><div class="empty">Ask an administrator to grant the required permission.</div></div></div>';switch(v){case'companies':return companiesPage();case'customers':return customersPage();case'packages':return packagesPage();case'billing':return billingPage();case'payments':return paymentsPage();case'expenses':return expensesPage();case'staff':return staffPage();case'reports':return reportsPage();case'import':return importPage();case'settings':return settingsPage();default:return dashboardPage()}}
function head(title,desc,buttons=''){return `<div class="page"><div class="title"><div><div class="actions" style="margin-bottom:10px"><button type="button" class="btn small" data-back>← Back</button><button type="button" class="btn small" data-home>⌂ Dashboard</button></div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function dashboardPage(){const m=metrics();return head('Admin / Reseller Billing Dashboard','Your supplier cost + customer retail model, with role-based access control.',`${can('companies')?'<button class="btn primary" data-open="company">+ Add Company</button>':''}${can('customers')?'<button class="btn" data-open="customer">+ Add Customer</button>':''}${can('billing')?'<button class="btn" data-open="invoice">+ Create Invoice</button>':''}`)+`<div class="grid"><div class="card metric"><div class="label">Active Customers</div><div class="value">${m.cs.length}</div><div class="green">Customer accounts</div></div><div class="card metric"><div class="label">Expected Monthly Revenue</div><div class="value">${money(m.sales)}</div><div class="blue">Active customer fees</div></div>${canSeeCosts()?`<div class="card metric"><div class="label">Supplier Cost</div><div class="value">${money(m.supplier)}</div><div class="amber">Package cost</div></div><div class="card metric"><div class="label">Gross Commission</div><div class="value green">${money(m.commission)}</div><div class="green">Your margin</div></div>`:''}<div class="card metric"><div class="label">Collected</div><div class="value">${money(m.collected)}</div><div class="green">Payments received</div></div><div class="card metric"><div class="label">Outstanding</div><div class="value red">${money(m.outstanding)}</div><div class="red">Customer dues</div></div><div class="card metric"><div class="label">Expenses</div><div class="value">${money(m.expenses)}</div><div class="amber">Other + salaries</div></div>${canSeeCosts()?`<div class="card metric"><div class="label">Net Profit</div><div class="value green">${money(m.net)}</div><div class="green">After supplier cost & expenses</div></div>`:''}</div><div class="card section"><h2>Live Data</h2><div class="grid"><div class="card metric"><div class="label">Companies</div><div class="value">${db.companies.length}</div><div class="blue">Supplier companies</div></div><div class="card metric"><div class="label">Customers</div><div class="value">${db.customers.length}</div><div class="blue">All customer accounts</div></div><div class="card metric"><div class="label">Packages</div><div class="value">${db.packages.length}</div><div class="blue">Supplier packages</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Company</th><th>Customers</th><th>Packages</th><th>Monthly Revenue</th><th>Commission</th></tr></thead><tbody>${db.companies.length?db.companies.map(c=>{const cc=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended');const rev=cc.reduce((a,x)=>a+Number(x.retail||packageOf(x.packageId)?.retail||0),0);const cost=cc.reduce((a,x)=>a+Number(packageOf(x.packageId)?.cost||0),0);return `<tr><td><b>${esc(c.name)}</b></td><td>${cc.length}</td><td>${db.packages.filter(p=>p.companyId===c.id).length}</td><td>${money(rev)}</td><td class="green">${money(rev-cost)}</td></tr>`}).join(''):`<tr><td colspan="5"><div class="empty">No companies yet. Add a company and it will appear here immediately.</div></td></tr>`}</tbody></table></div></div><div class="twocol section"><div class="card"><h2>How your billing works</h2><div class="profitrow"><span>Supplier package cost</span><b>${money(m.supplier)}</b></div><div class="profitrow"><span>Customer retail sales</span><b>${money(m.sales)}</b></div><div class="profitrow"><span>Gross commission</span><b class="green">${money(m.commission)}</b></div><div class="profitrow"><span>Other expenses + salaries</span><b>${money(m.expenses)}</b></div><div class="profitrow"><span>Net profit</span><b class="green">${money(m.net)}</b></div></div><div class="card"><h2>Quick actions</h2><div class="actions">${can('packages')?'<button class="btn primary" data-open="package">+ Supplier Package</button>':''}<button class="btn" data-open="payment">+ Receive Payment</button><button class="btn" data-view="reports">View Profit Report</button></div><p class="subtle" style="margin-top:18px">No MikroTik or ZalPro connection is required. You can run this as your own reseller billing database and import your existing data from Excel/CSV.</p></div></div></div>`}
function companiesPage(){return head('Companies / Suppliers','The companies that give you internet packages.',`<button class="btn primary" data-open="company">+ Add Company</button>`)+`<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Company</th><th>Contact</th><th>Packages</th><th>Customers</th><th>Monthly Cost</th><th>Actions</th></tr></thead><tbody>${db.companies.length?db.companies.map(c=>{const ps=db.packages.filter(p=>p.companyId===c.id).length,cs=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended').length,cost=db.customers.filter(x=>x.companyId===c.id&&x.status!=='Suspended').reduce((a,x)=>a+Number(packageOf(x.packageId)?.cost||0),0);return `<tr><td><b>${esc(c.name)}</b><br><span class="subtle">${esc(c.code||'')}</span></td><td>${esc(c.phone||'—')}<br>${esc(c.email||'')}</td><td>${ps}</td><td>${cs}</td><td>${money(cost)}</td><td><button class="btn small" data-edit-company="${c.id}">Edit</button> <button class="btn small danger" data-delete-company="${c.id}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">No supplier companies yet. Add the first company.</div></td></tr>`}</tbody></table></div></div></div>`}
function customersPage(){const cs=customers();return head('Customers','Customers buying packages from you.',`<button class="btn primary" data-open="customer">+ Add Customer</button><button class="btn" data-open="invoice">+ Create Invoice</button>`)+`<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Company</th><th>Package</th><th>Retail</th>${canSeeCosts()?'<th>Supplier Cost</th><th>Commission</th>':''}<th>Due</th><th>Actions</th></tr></thead><tbody>${cs.length?cs.map(c=>{const p=packageOf(c.packageId),ret=Number(c.retail||0),cost=Number(p?.cost||0),due=db.invoices.filter(i=>i.customerId===c.id).reduce((a,i)=>a+Number(i.retail||0)-Number(i.paid||0),0);return `<tr><td><b>${esc(c.name)}</b><br><span class="subtle">${esc(c.username||'')} ${esc(c.phone||'')}</span></td><td>${esc(companyName(c.companyId))}</td><td>${esc(p?.name||'—')}</td><td>${money(ret)}</td>${canSeeCosts()?`<td>${money(cost)}</td><td class="green">${money(ret-cost)}</td>`:''}<td class="${due>0?'red':'green'}">${money(due)}</td><td><button class="btn small" data-edit-customer="${c.id}">Edit</button> <button class="btn small success" data-customer-invoice="${c.id}">Invoice</button> <button class="btn small danger" data-delete-customer="${c.id}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="8"><div class="empty">No customers yet.</div></td></tr>`}</tbody></table></div></div></div>`}
function packagesPage(){const ps=packages();return head('Supplier Packages','Record the price your upstream company charges you. Set your customer retail price separately.',`<button class="btn primary" data-open="package">+ Add Supplier Package</button>`)+`<div class="notice">Example: Supplier gives <b>10 Mbps</b> for <b>Rs. 500</b>. You sell it to your customer for <b>Rs. 700</b>. Your commission is <b>Rs. 200</b>.</div><div class="card section"><div class="tablewrap"><table class="table"><thead><tr><th>Package</th><th>Supplier</th><th>Bandwidth</th>${canSeeCosts()?'<th>Supplier Cost</th>':''}<th>Default Retail</th>${canSeeCosts()?'<th>Margin</th>':''}<th>Actions</th></tr></thead><tbody>${ps.length?ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(companyName(p.companyId))}</td><td>${esc(p.bandwidth||'')}</td>${canSeeCosts()?`<td>${money(p.cost)}</td>`:''}<td>${money(p.retail)}</td>${canSeeCosts()?`<td class="green">${money(Number(p.retail)-Number(p.cost))}</td>`:''}<td><button class="btn small" data-edit-package="${p.id}">Edit</button> <button class="btn small danger" data-delete-package="${p.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No packages yet.</div></td></tr>`}</tbody></table></div></div></div>`}
function billingPage(){const ins=invoices();return head('Billing & Invoices','Generate monthly customer bills and track unpaid/partial/paid invoices.',`<button class="btn primary" data-open="invoice">+ Create Invoice</button><button class="btn" id="generateMonthly">Generate Monthly Bills</button>`)+`<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Company</th><th>Period</th><th>Retail</th>${canSeeCosts()?'<th>Supplier Cost</th><th>Profit</th>':''}<th>Paid</th><th>Status</th><th>Actions</th></tr></thead><tbody>${ins.length?ins.slice().reverse().map(i=>{const bal=Number(i.retail)-Number(i.paid||0),st=bal<=0?'paid':Number(i.paid)>0?'partial':'unpaid';return `<tr><td><b>${esc(i.no)}</b></td><td>${esc(db.customers.find(c=>c.id===i.customerId)?.name||'')}</td><td>${esc(companyName(i.companyId))}</td><td>${esc(i.period||'')}</td><td>${money(i.retail)}</td>${canSeeCosts()?`<td>${money(i.cost)}</td><td class="green">${money(Number(i.retail)-Number(i.cost))}</td>`:''}<td>${money(i.paid)}</td><td><span class="badge ${st}">${st.toUpperCase()}</span></td><td><button class="btn small success" data-pay-invoice="${i.id}">Payment</button></td></tr>`}).join(''):`<tr><td colspan="10"><div class="empty">No invoices yet. Create your first monthly invoice.</div></td></tr>`}</tbody></table></div></div></div>`}
function paymentsPage(){return head('Payments','Money collected from customers against invoices.',`<button class="btn primary" data-open="payment">+ Receive Payment</button>`)+`<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead><tbody>${db.payments.length?db.payments.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(db.invoices.find(i=>i.id===p.invoiceId)?.no||'')}</td><td>${esc(db.customers.find(c=>c.id===p.customerId)?.name||'')}</td><td class="green">${money(p.amount)}</td><td>${esc(p.method||'Cash')}</td><td>${esc(p.note||'')}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No payments recorded.</div></td></tr>`}</tbody></table></div></div></div>`}

function staffPage(){const localStaff=db.staff;return head('Staff Management','Manage staff salaries and secure staff accounts.',`${canManageStaff()?'<button class="btn primary" data-open="staff">+ Add Staff</button>':''}`)+`<div class="twocol"><div class="card"><h2>Staff Salary Register</h2><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Company</th><th>Salary</th><th>Status</th><th>Action</th></tr></thead><tbody>${localStaff.length?localStaff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${esc(companyName(s.companyId))}</td><td>${money(s.salary)}</td><td>${s.active!==false?'Active':'Inactive'}</td><td>${canManageStaff()?`<button class="btn small danger" data-delete-staff="${s.id}">Delete</button>`:''}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No staff added.</div></td></tr>`}</tbody></table></div></div></div><div class="card"><h2>Staff Accounts & Permissions</h2>${canManageStaff()?`<div class="formgrid"><div class="field"><label>Staff email</label><input id="inviteEmail" type="email" placeholder="staff@example.com"></div><div class="field"><label>Permission role</label><select id="inviteRole"><option value="admin">Admin — everything</option><option value="manager">Manager — operations + reports</option><option value="billing">Billing — customers, invoices, payments</option><option value="support">Support — customers only</option></select></div><div class="field"><label>Invite valid for (days)</label><input id="inviteDays" type="number" min="1" max="30" value="7"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="createInvite">Create Staff Invite</button></div><div id="inviteResult" style="margin-top:12px"></div>`:'<div class="notice">Only Owner/Admin can create staff accounts and change permissions.</div>'}<div class="section"><h3>How permissions work</h3><div class="permgrid"><div class="perm"><b>Owner / Admin</b><br><span class="subtle">All companies, supplier costs, profits, billing, expenses, reports and staff accounts.</span></div><div class="perm"><b>Manager</b><br><span class="subtle">Operations, customers, packages, billing, payments, expenses and reports. No staff-account administration.</span></div><div class="perm"><b>Billing</b><br><span class="subtle">Customers, invoices and payments. Supplier cost and profit are hidden.</span></div><div class="perm"><b>Support</b><br><span class="subtle">Customer information only. Financial and supplier information is hidden.</span></div></div></div><div class="section"><h3>Claim a staff invite</h3><p class="subtle">A staff member first creates/logs into their account, then pastes the one-time invite token supplied by an administrator.</p><div class="actions"><input id="claimToken" class="search" style="max-width:520px" placeholder="Paste invite token"><button class="btn success" id="claimInvite">Claim Invite</button></div></div></div></div>`}

function settingsPage(){const url=localStorage.getItem(SUPABASE_URL_KEY)||DEFAULT_SUPABASE_URL;const key=localStorage.getItem(SUPABASE_ANON_KEY)||DEFAULT_SUPABASE_PUBLISHABLE_KEY;return head('Settings','Cloud database, account security and permissions.',`<button class="btn" data-cloud-save>Save Cloud Settings</button>`)+`<div class="grid"><div class="card metric"><div class="label">Signed-in Account</div><div class="value" style="font-size:18px">${esc(cloudUser?.email||'Not logged in')}</div><div class="green">${cloudReady?'Cloud connected':'Local mode'}</div></div><div class="card metric"><div class="label">Permission Role</div><div class="value" style="font-size:20px">${role().toUpperCase()}</div><div class="blue">Role-based access</div></div><div class="card metric"><div class="label">Workspace</div><div class="value" style="font-size:15px">${workspaceId?'Connected':'Not assigned'}</div><div class="subtle">Shared across approved staff</div></div><div class="card metric"><div class="label">Supplier Costs</div><div class="value" style="font-size:20px">${canSeeCosts()?'Visible':'Hidden'}</div><div class="subtle">Financial permission</div></div></div><div class="twocol section"><div class="card"><h2>☁ Supabase Cloud Database</h2><p class="subtle">Run the included V15 SQL setup in Supabase, then paste your Project URL and publishable key.</p><div class="field" style="margin-top:12px"><label>Supabase Project URL</label><input id="sbUrl" value="${esc(url)}" placeholder="https://xxxx.supabase.co"></div><div class="field" style="margin-top:12px"><label>Supabase publishable key</label><input id="sbKey" value="${esc(key)}" placeholder="eyJ..."></div><div class="notice" style="margin-top:12px">Never paste your service-role/secret key into the website.</div></div><div class="card"><h2>Account</h2><div class="field"><label>Email</label><input id="cloudEmail" type="email" value="${esc(cloudUser?.email||'')}" placeholder="admin@example.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="cloudPassword" type="password" placeholder="Password"></div><div class="actions" style="margin-top:14px"><button class="btn primary" data-cloud-login>Login</button><button class="btn" data-cloud-signup>Create Account</button><button class="btn danger" data-cloud-logout>Logout</button></div><p class="subtle" style="margin-top:12px">Status: <b>${cloudUser?esc(cloudUser.email):'Not logged in'}</b> • Role: <b>${role()}</b></p></div></div><div class="card section"><h2>Permission Matrix</h2><div class="permgrid"><div class="perm"><b>Owner/Admin</b><br>Full access.</div><div class="perm"><b>Manager</b><br>Operations + reports; no staff-account admin.</div><div class="perm"><b>Billing</b><br>Customers + billing + payments; no supplier costs/profit.</div><div class="perm"><b>Support</b><br>Customer information only.</div></div></div><div class="card section"><h2>Local Data</h2><p class="subtle">Local browser data is only a fallback. Once cloud login is connected, the shared workspace is stored in Supabase.</p><button class="btn danger" id="clearData">Clear Local Data</button></div></div>`}

ked.'))return;const id=b.dataset.deletePackage;db.packages=db.packages.filter(x=>x.id!==id);db.customers.forEach(c=>{if(c.packageId===id)c.packageId=''});save();toast('Package deleted')});document.querySelectorAll('[data-edit-customer]').forEach(b=>b.onclick=()=>openModal('customer',db.customers.find(x=>x.id===b.dataset.editCustomer)));document.querySelectorAll('[data-customer-invoice]').forEach(b=>b.onclick=()=>openModal('invoice',{customerId:b.dataset.customerInvoice}));document.querySelectorAll('[data-pay-invoice]').forEach(b=>b.onclick=()=>openModal('payment',{invoiceId:b.dataset.payInvoice}));document.querySelectorAll('[data-delete-expense]').forEach(b=>b.onclick=()=>{if(confirm('Delete this expense?')){db.expenses=db.expenses.filter(x=>x.id!==b.dataset.deleteExpense);save()}});document.querySelectorAll('[data-delete-staff]').forEach(b=>b.onclick=()=>{if(confirm('Delete this staff member?')){db.staff=db.staff.filter(x=>x.id!==b.dataset.deleteStaff);save()}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;closeMobile();render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);const clearLocal=document.getElementById('clearData');if(clearLocal)clearLocal.onclick=()=>{if(confirm('Clear ALL local data?')){localStorage.removeItem(KEY);location.reload()}};const exp=document.querySelector('[data-export]');if(exp)exp.onclick=()=>{const t=exp.dataset.export;if(t==='companies')download('companies.csv',csv(db.companies));if(t==='customers')download('customers.csv',csv(db.customers));if(t==='report')download('profit-report.csv',csv(invoices().map(i=>({invoice:i.no,customer:db.customers.find(c=>c.id===i.customerId)?.name,company:companyName(i.companyId),sales:i.retail,supplierCost:i.cost,commission:+i.retail-+i.cost,paid:i.paid,outstanding:+i.retail-+i.paid}))))};const imp=document.getElementById('doImport');if(imp)imp.onclick=doImport;const gm=document.getElementById('generateMonthly');if(gm)gm.onclick=generateMonthly;

async function doImport(){const f=document.getElementById('importFile')?.files[0],type=document.getElementById('importType')?.value;if(!f)return alert('Select an Excel or CSV file first.');const reader=new FileReader();reader.onload=e=>{try{let rows;if(f.name.toLowerCase().endsWith('.csv')){const text=e.target.result;rows=text.split(/\r?\n/).filter(Boolean).map(line=>line.split(',').map(x=>x.replace(/^"|"$/g,'')));const h=rows.shift().map(x=>x.trim().toLowerCase());rows=rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}else{const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}if(type==='companies')rows.forEach(r=>db.companies.push({id:uid(),name:r.name||r.Name||'',code:r.code||'',phone:r.phone||'',email:r.email||''}));if(type==='packages')rows.forEach(r=>{const c=db.companies.find(c=>c.name.toLowerCase()==String(r.company||'').toLowerCase());if(c)db.packages.push({id:uid(),companyId:c.id,name:r.name||r.package||'',bandwidth:r.bandwidth||'',cost:+(r.cost||r.rate||0),retail:+(r.retail||r.sale||0),duration:r.duration||'30 Days'})});if(type==='customers')rows.forEach(r=>{const c=db.companies.find(c=>c.name.toLowerCase()==String(r.company||'').toLowerCase());const p=db.packages.find(p=>p.name.toLowerCase()==String(r.package||'').toLowerCase()&&p.companyId===c?.id);if(c)db.customers.push({id:uid(),name:r.name||'',username:r.username||r.user||'',phone:r.phone||'',status:r.status||'Active',companyId:c.id,packageId:p?.id||'',retail:+(r.retail||r.sale||p?.retail||0),billingDay:+(r.billingDay||1)});});save();toast('Import completed')}catch(err){alert('Import error: '+err.message)}};if(f.name.toLowerCase().endsWith('.csv'))reader.readAsText(f);else reader.readAsArrayBuffer(f)}

// V16 interaction hardening: modal cancel, Escape, backdrop, Back/Dashboard buttons and Excel paste import.
(function(){
  function closeAny(){ var b=document.getElementById('modalBack'); if(b)b.classList.remove('show'); }
  document.addEventListener('click',function(e){
    var c=e.target.closest('[data-close]'); if(c){e.preventDefault();e.stopPropagation();closeAny();return;}
    var back=e.target.closest('[data-back]'); if(back){e.preventDefault();closeMobile(); if(window.history.length>1){history.back()} else {view='dashboard';render()} return;}
    var home=e.target.closest('[data-home]'); if(home){e.preventDefault();closeAny();closeMobile();view='dashboard';render();return;}
    if(e.target.id==='modalBack'){closeAny();return;}
    var t=e.target.closest('[data-template]'); if(t){e.preventDefault();var type=t.dataset.template;var rows={companies:[['name','code','phone','email'],['Example Internet','EX01','03001234567','info@example.com']],packages:[['name','company','bandwidth','cost','retail','duration'],['10 Mbps','Example Internet','10 Mbps','500','700','30 Days']],customers:[['name','username','phone','company','package','retail','billingDay','status'],['Ali','ali01','03001234567','Example Internet','10 Mbps','700','1','Active']]};download(type+'-template.csv',csv(rows));return;}
    if(e.target.id==='doPasteImport'){e.preventDefault();pasteImport();return;}
  },true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAny();if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();history.back()}});
  function pasteImport(){var ta=document.getElementById('excelPaste'),type=document.getElementById('pasteType')?.value||'companies';var text=(ta?.value||'').trim();if(!text)return alert('Excel data paste karo.');var lines=text.split(/\r?\n/).filter(Boolean);var rows=lines.map(function(line){return line.split(/\t|,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(function(x){return x.trim().replace(/^\"|\"$/g,'')})});var h=rows.shift().map(function(x){return x.toLowerCase().trim()});var objs=rows.map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]||''});return o});
    try{if(type==='companies')objs.forEach(function(r){if(!r.name)return;db.companies.push({id:uid(),name:r.name,code:r.code||'',phone:r.phone||'',email:r.email||'',notes:r.notes||''})});
    if(type==='packages')objs.forEach(function(r){var c=db.companies.find(function(c){return c.name.toLowerCase()===String(r.company||'').toLowerCase()});if(c&&r.name)db.packages.push({id:uid(),companyId:c.id,name:r.name,bandwidth:r.bandwidth||'',cost:+(r.cost||r.rate||0),retail:+(r.retail||r.sale||0),duration:r.duration||'30 Days'})});
    if(type==='customers')objs.forEach(function(r){var c=db.companies.find(function(c){return c.name.toLowerCase()===String(r.company||'').toLowerCase()});var p=db.packages.find(function(p){return p.companyId===c?.id&&p.name.toLowerCase()===String(r.package||'').toLowerCase()});if(c&&r.name)db.customers.push({id:uid(),name:r.name,username:r.username||r.user||'',phone:r.phone||'',status:r.status||'Active',companyId:c.id,packageId:p?.id||'',retail:+(r.retail||r.sale||p?.retail||0),billingDay:+(r.billingDay||1)})});save();toast('Excel pasted data imported successfully');if(ta)ta.value='';render();}catch(err){alert('Paste import error: '+err.message)}}
})();
